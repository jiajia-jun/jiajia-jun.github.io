{{- /* 传入的是 .Paginate 返回的 Paginator */ -}}
{{- if gt .TotalPages 1 }}
<nav class="pagination" aria-label="分页导航">
  {{- if .HasPrev }}
  <a class="page-btn" href="{{ .Prev.URL }}" rel="prev">← 上一页</a>
  {{- else }}
  <span class="page-btn is-disabled">← 上一页</span>
  {{- end }}

  <span class="page-info">{{ .PageNumber }} / {{ .TotalPages }}</span>

  {{- if .HasNext }}
  <a class="page-btn" href="{{ .Next.URL }}" rel="next">下一页 →</a>
  {{- else }}
  <span class="page-btn is-disabled">下一页 →</span>
  {{- end }}
</nav>
{{- end }}
