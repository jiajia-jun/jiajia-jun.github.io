{{ define "main" }}
<article class="post container prose">
  <header class="post-head">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- with .Description }}
    <p class="post-lede">{{ . }}</p>
    {{- end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
