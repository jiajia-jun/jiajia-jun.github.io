{{ define "main" }}
<div class="container notfound">
  <p class="notfound-code" aria-hidden="true">404</p>
  <h1 class="notfound-title">页面不存在</h1>
  <p class="notfound-desc">你要找的页面可能已经被移动或删除了</p>
  <p class="notfound-actions">
    <a class="btn" href="{{ site.Home.RelPermalink }}">回到首页</a>
    <a class="btn btn-ghost" href="{{ "/archives/" | relURL }}">看看归档</a>
  </p>
</div>
{{ end }}
